<!-- index.html --> 
<!DOCTYPE html> 
<html lang="id"> 
<head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Praktikum JavaScript</title>
        <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin: auto;
        }
        h1 {
            text-align: center;
        }
        h2 {
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 4px;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
    </style> 
</head> 
<body> 
    <h1>Pengenalan JavaScript</h1> 
    <p id="pesan">Konten awal.</p> 
    <script src="script.js"></script> 
        <label for="bilangan">Masukkan bilangan bulat:</label> 
        <input type="number" id="bilangan" step="1" style="width: 50%;"> 
        <button type="button" onclick="cekBilangan()">Periksa</button> 
        <p id="hasilBilangan"></p> 

        <button style="background-color:#a8f06a ;color: green;" type="button" onclick="ubahWarnaLatar('#a8f06a')">Latar Hijau</button> 
        <button style="background-color:#f4f4f9 ;color: black;"type="button" onclick="ubahWarnaLatar('white')">Latar Putih</button> 
        <button style="background-color:#bff7fa ;color: blue;"type="button" onclick="ubahWarnaLatar('#bff7fa')">Latar biru</button>

        <h3>Daftar Menu Makanan</h3> 
            <label><input type="checkbox" class="menu" value="5000"> Ayam Goreng — Rp5.000</label><br> 
            <label><input type="checkbox" class="menu" value="500"> Tempe — Rp500</label><br> 
            <label><input type="checkbox" class="menu" value="2500"> Telur Dadar — Rp2.500</label><br> 
            <p>Total: Rp<span id="total">0</span></p> 
    <div class="container">
    <h2>Kalkulator Nilai Mahasiswa</h2>
    
    <!-- Form Input Nilai -->
    <div class="form-group">
        <label for="tugas">Nilai Tugas (0 - 100):</label>
        <input type="number" id="tugas" min="0" max="100" placeholder="Masukkan nilai tugas">
    </div>

    <div class="form-group">
        <label for="uts">Nilai UTS (0 - 100):</label>
        <input type="number" id="uts" min="0" max="100" placeholder="Masukkan nilai UTS">
    </div>

    <div class="form-group">
        <label for="uas">Nilai UAS (0 - 100):</label>
        <input type="number" id="uas" min="0" max="100" placeholder="Masukkan nilai UAS">
    </div>

    <button  style=" width: 100%; padding: 10px; background-color: #007BFF; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;" onclick="prosesHitung()">Hitung Nilai</button>

    <div id="pesanError" class="error"></div>

    <!-- Area Tampilan Hasil -->
    <div class="result" id="areaHasil" style="display: none;">
        <h3>Hasil Perhitungan:</h3>
        <p><strong>Nilai Akhir:</strong> <span id="resNilaiAkhir"></span></p>
        <p><strong>Predikat:</strong> <span id="resPredikat"></span></p>
        <p><strong>Status:</strong> <span id="resStatus"></span></p>
    </div>
</div> 
         
</body> 
</html>
